<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .activity-card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 5px; background: #f9f9f9;}
        button { padding: 5px 10px; background: #dc3545; color: white; border: none; cursor: pointer; float:right;}
    </style>
</head>
<body>
    <button onclick="logout()">Logout</button>
    <h1 id="welcomeMsg">Loading...</h1>
    
    <h2>Your Authorized Activities:</h2>
    <div id="activitiesList"></div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            const userName = localStorage.getItem('userName');
            
            if (!token) {
                window.location.href = '/';
                return;
            }

            document.getElementById('welcomeMsg').innerText = `Welcome, ${userName}`;

            // Fetch RBAC Activities
            const response = await fetch('/api/activities', {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (response.ok) {
                const activities = await response.json();
                const listDiv = document.getElementById('activitiesList');
                activities.forEach(act => {
                    listDiv.innerHTML += `
                        <div class="activity-card">
                            <h3>${act.activityname}</h3>
                            <p>${act.accessdetail}</p>
                        </div>
                    `;
                });
            } else {
                logout();
            }
        });

        function logout() {
            localStorage.clear();
            window.location.href = '/';
        }
    </script>
</body>
</html>
